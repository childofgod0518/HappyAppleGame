<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f7b4c">
  <meta name="description" content="接住松鼠丟下的蘋果，閃過帶刺栗子的可愛森林小遊戲。">
  <title>松鼠的蘋果雨</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23e83d35' d='M32 17c-18-13-30 4-25 20 4 15 16 22 25 19 9 3 21-4 25-19 5-16-7-33-25-20Z'/%3E%3Cpath fill='%23458c3b' d='M33 16c2-10 12-13 21-8-3 8-12 12-21 8Z'/%3E%3Cpath fill='%235a3524' d='M29 18c0-6 1-10 4-14l4 3c-2 3-3 6-3 11Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="game-header">
      <div class="title-lockup">
        <span class="eyebrow">FOREST CATCH</span>
        <h1>松鼠的蘋果雨</h1>
      </div>
      <button id="soundBtn" class="sound-button" type="button" aria-pressed="true" aria-label="關閉音效">
        <span aria-hidden="true">♫</span> 音效開
      </button>
    </header>

    <section class="game-card" aria-label="松鼠的蘋果雨遊戲">
      <div class="status-bar" aria-live="polite">
        <div class="score-pill"><span>得分</span><strong id="score">0</strong></div>
        <div class="level-pill"><span>難度</span><strong id="level">1</strong></div>
        <div class="lives" id="lives" aria-label="剩餘 3 顆心">
          <span>生命</span><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
        </div>
      </div>

      <div id="arena" class="arena" tabindex="0" aria-describedby="instructions">
        <div class="sun-glow" aria-hidden="true"></div>
        <div id="player" class="player sprite" aria-label="揹著籃子的玩家"></div>
        <div id="feedback" class="feedback" aria-live="assertive"></div>

        <div id="startOverlay" class="overlay">
          <div class="overlay-card">
            <div class="mini-apple" aria-hidden="true">●</div>
            <h2>準備接蘋果！</h2>
            <p>左右移動籃子接住紅蘋果，看到刺刺栗子要趕快閃開。</p>
            <button id="startBtn" class="primary-button" type="button">開始遊戲</button>
          </div>
        </div>

        <div id="gameOverOverlay" class="overlay hidden">
          <div class="overlay-card game-over-card">
            <span class="over-label">這一籃收成</span>
            <h2><strong id="finalScore">0</strong> 顆蘋果</h2>
            <p id="finalMessage">再試一次，創下新紀錄吧！</p>
            <button id="restartBtn" class="primary-button" type="button">重新開始</button>
          </div>
        </div>

        <div id="pauseBadge" class="pause-badge hidden">暫停中</div>
      </div>

      <p id="instructions" class="instructions">
        <kbd>←</kbd><kbd>→</kbd> 或 <kbd>A</kbd><kbd>D</kbd> 左右移動
        <span aria-hidden="true">·</span> 蘋果 +1 <span aria-hidden="true">·</span> 漏接蘋果／接到栗子 -1 ♥
      </p>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
